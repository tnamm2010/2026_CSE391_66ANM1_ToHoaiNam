<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Goals</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" 
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  
  <header class="header">
    <div class="container header__inner">
      <a class="logo" href="#">TRAVEL GOALS</a>

      <nav class="nav">
        <a href="#destinations" class="nav__link">Destinations</a>
        <a href="#about" class="nav__link">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" id="about">
      <div class="hero__overlay"></div>

      <div class="container hero__content">
        <div class="hero__card">
          <h1>JOE'S TRAVEL PAGE</h1>
          <p>LET'S EXPLORE THE WORLD TOGETHER!</p>
          <a class="btn" href="#destinations">Discover places</a>
        </div>
      </div>
    </section>

    <section class="highlights" id="destinations">
      <div class="container">
        <h2 class="section-title">HIGHLIGHTS</h2>

        <div class="grid">
          <article class="place">
            <div class="place__img" style="background-image:url(https://png.pngtree.com/thumb_back/fw800/background/20230614/pngtree-city-in-miami-with-palm-trees-and-umbrellas-on-the-beach-image_2970581.jpg);"></div>
            <h3 class="place__title">MIAMI <span>USA</span></h3>
          </article>

          <article class="place">
            <div class="place__img" style="background-image:url('https://tourscanner.com/blog/wp-content/uploads/2022/08/fun-and-unusual-things-to-do-in-Tokyo-Japan.jpg');"></div>
            <h3 class="place__title">TOKYO <span>JAPAN</span></h3>
          </article>

          <article class="place">
            <div class="place__img" style="background-image:url('https://wallpaperaccess.com/full/1192125.jpg');"></div>
            <h3 class="place__title">PARIS <span>FRANCE</span></h3>
          </article>
        </div>
      </div>
    </section>
  </main>

 <footer class="footer">
  <div class="container footer__inner">
    <a class="social" href="#" aria-label="Instagram">
      <i class="fa-brands fa-instagram"></i>
    </a>

    <a class="social" href="#" aria-label="Facebook">
      <i class="fa-brands fa-facebook-f"></i>
    </a>
  </div>
</footer>
</body>
</html>
