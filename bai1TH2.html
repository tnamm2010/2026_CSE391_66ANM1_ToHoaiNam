<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bai 1 thuc hanh 2 CSS</title>
  <link rel="stylesheet" href="anbatukam.css" />
</head>
<body>

  <div class="wrapper">
    <div class="form-container">
      <h2>Get in touch with us by filling contact form below</h2>

      <form>
        <div class="row">
          <input class="half" type="text" placeholder="* Enter your full name">
          <input class="half" type="email" placeholder="* Enter your email address">
        </div>

        <div class="row">
          <input type="text" placeholder="Enter your subject">
        </div>

        <div class="row">
          <textarea placeholder="* Your message here..."></textarea>
        </div>

        <div class="footer">
          <button type="submit">Send message</button>
          <div class="note">* Please fill all required form field, thanks!</div>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
